<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Massimo De Nittis, Laravel developer from Limburg, Belgium">
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace; }
    .name { font-size: 54px; font-weight: 700; fill: #f0f3f6; letter-spacing: -1px; }
    .sub { font-size: 22px; fill: #9aa4b2; }
    .prompt { font-size: 16px; fill: #9aa4b2; }
    .role { font-size: 19px; fill: #e6edf3; }
    .code { font-size: 17px; }
    .c-muted { fill: #6e7681; }
    .c-var { fill: #ff7b72; }
    .c-cls { fill: #ffa657; }
    .c-fn { fill: #d2a8ff; }
    .c-str { fill: #a5d6ff; }
    .c-txt { fill: #c9d1d9; }

    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes glow { 0%, 100% { opacity: .55; } 50% { opacity: .85; } }
    @keyframes r1 { 0% { opacity: 0; } 3%, 30% { opacity: 1; } 33%, 100% { opacity: 0; } }
    @keyframes r2 { 0%, 33% { opacity: 0; } 36%, 63% { opacity: 1; } 66%, 100% { opacity: 0; } }
    @keyframes r3 { 0%, 66% { opacity: 0; } 69%, 96% { opacity: 1; } 99%, 100% { opacity: 0; } }

    .in1 { animation: rise .7s ease-out .1s both; }
    .in2 { animation: rise .7s ease-out .3s both; }
    .in3 { animation: rise .7s ease-out .5s both; }
    .in4 { animation: rise .7s ease-out .7s both; }
    .l1 { animation: rise .5s ease-out 1.0s both; }
    .l2 { animation: rise .5s ease-out 1.2s both; }
    .l3 { animation: rise .5s ease-out 1.4s both; }
    .l4 { animation: rise .5s ease-out 1.6s both; }
    .l5 { animation: rise .5s ease-out 1.8s both; }
    .l6 { animation: rise .5s ease-out 2.0s both; }
    .cursor { animation: blink 1.1s step-end infinite; }
    .glow { animation: glow 6s ease-in-out infinite; }
    .rot2, .rot3 { opacity: 0; }
    .rot1 { animation: r1 12s linear 1s infinite both; }
    .rot2 { animation: r2 12s linear 1s infinite both; }
    .rot3 { animation: r3 12s linear 1s infinite both; }
  </style>

  <defs>
    <radialGradient id="redglow" cx="0.12" cy="1" r="0.75">
      <stop offset="0" stop-color="#FF2D20" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF2D20" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="340" fill="#0b0f17"/>
    <rect width="1200" height="340" fill="url(#dots)"/>
    <rect class="glow" width="1200" height="340" fill="url(#redglow)"/>
    <rect x="0" y="0" width="1200" height="4" fill="#FF2D20"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="18" fill="none" stroke="#232b3b"/>

  <!-- Left: who -->
  <g class="in1">
    <text x="60" y="92" class="mono prompt"><tspan fill="#FF2D20">~/zonhoven</tspan> $ whoami<tspan class="cursor" fill="#FF2D20"> _</tspan></text>
  </g>
  <g class="in2">
    <text x="58" y="160" class="sans name">Massimo De Nittis</text>
  </g>
  <g class="in3">
    <text x="60" y="200" class="sans sub">Laravel developer from Limburg, Belgium</text>
  </g>
  <g class="in4">
    <rect x="60" y="236" width="4" height="26" rx="2" fill="#FF2D20"/>
    <text x="78" y="256" class="sans role rot1">Building Assurio, a SaaS for insurance brokers</text>
    <text x="78" y="256" class="sans role rot2">Putting AI into real business software</text>
    <text x="78" y="256" class="sans role rot3">Teaching full stack at SyntraPXL in Genk</text>
  </g>

  <!-- Right: code window -->
  <g transform="translate(640 48)">
    <rect width="512" height="244" rx="12" fill="#11161f" stroke="#2a3344"/>
    <path d="M0 12 a12 12 0 0 1 12 -12 h488 a12 12 0 0 1 12 12 v26 h-512 z" fill="#161c27"/>
    <circle cx="22" cy="19" r="6" fill="#ff5f57"/>
    <circle cx="42" cy="19" r="6" fill="#febc2e"/>
    <circle cx="62" cy="19" r="6" fill="#28c840"/>
    <text x="256" y="24" text-anchor="middle" class="mono c-muted" font-size="13">Massimo.php</text>

    <g class="mono code">
      <text x="24" y="74" class="l1 c-muted">&lt;?php</text>
      <text x="24" y="112" class="l2"><tspan class="c-var">$massimo</tspan><tspan class="c-txt"> = </tspan><tspan class="c-cls">Developer</tspan><tspan class="c-txt">::</tspan><tspan class="c-fn">make</tspan><tspan class="c-txt">()</tspan></text>
      <text x="65" y="142" class="l3"><tspan class="c-txt">-&gt;</tspan><tspan class="c-fn">based</tspan><tspan class="c-txt">(</tspan><tspan class="c-str">'Zonhoven, BE'</tspan><tspan class="c-txt">)</tspan></text>
      <text x="65" y="172" class="l4"><tspan class="c-txt">-&gt;</tspan><tspan class="c-fn">stack</tspan><tspan class="c-txt">([</tspan><tspan class="c-str">'Laravel'</tspan><tspan class="c-txt">, </tspan><tspan class="c-str">'PHP'</tspan><tspan class="c-txt">, </tspan><tspan class="c-str">'React'</tspan><tspan class="c-txt">])</tspan></text>
      <text x="65" y="202" class="l5"><tspan class="c-txt">-&gt;</tspan><tspan class="c-fn">building</tspan><tspan class="c-txt">(</tspan><tspan class="c-str">'Assurio'</tspan><tspan class="c-txt">)</tspan></text>
      <text x="65" y="232" class="l6"><tspan class="c-txt">-&gt;</tspan><tspan class="c-fn">teaching</tspan><tspan class="c-txt">(</tspan><tspan class="c-str">'SyntraPXL'</tspan><tspan class="c-txt">);</tspan></text>
    </g>
  </g>
</svg>
